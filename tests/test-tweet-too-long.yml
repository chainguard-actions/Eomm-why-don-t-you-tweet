name: Test tweet too long
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build a tweet message that exceeds 280 characters
        id: build-message
        run: |
          # Create a message longer than 280 characters
          MSG=$(python3 -c "print('A' * 281)")
          echo "message=$MSG" >> $GITHUB_OUTPUT
      - id: action
        uses: .
        continue-on-error: true
        with:
          tweet-message: ${{ steps.build-message.outputs.message }}
        # No Twitter credentials needed — the length check happens before credential check
      - name: Assert action failed due to tweet being too long
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail because tweet is too long, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when tweet exceeds 280 characters"
