name: Test tweet message too long
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a tweet message exceeding 280 characters (expect failure)
        id: action
        uses: .
        with:
          tweet-message: >-
            This tweet message is intentionally way too long and exceeds the
            maximum allowed length of 280 characters for a tweet. We are adding
            more and more text here to make absolutely sure that the length
            validation in the action triggers and causes the action to fail with
            an appropriate error message about the tweet being too long for Twitter.
        continue-on-error: true

      - name: Assert action failed due to tweet being too long
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tweet exceeds 280 characters, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when tweet message was too long"
