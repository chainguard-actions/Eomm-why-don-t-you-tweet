name: Test missing Twitter credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tweet-message: "Hello from GitHub Actions!"
        # No TWITTER_CONSUMER_API_KEY or TWITTER_CONSUMER_API_SECRET set
      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing Twitter credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when Twitter credentials are missing"
