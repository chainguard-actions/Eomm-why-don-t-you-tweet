name: Test custom tweet length limit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tweet-message: "Hello World!"
          # "Hello World!" is 12 chars, set limit to 10 to trigger the error
          length: "10"
        # No Twitter credentials needed — the length check happens before credential check
      - name: Assert action failed due to custom length limit exceeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail because tweet exceeds custom length limit, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when tweet exceeds custom length limit"
