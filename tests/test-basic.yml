name: Test basic tweet message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: tweet
        name: Invoke tweet action
        uses: .
        continue-on-error: true
        with:
          tweet-message: "Hello from GitHub Actions test!"
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert action was invoked
        run: |
          echo "outcome: ${{ steps.tweet.outcome }}"
          # The action will fail without real Twitter credentials,
          # but it should have been invoked (outcome is 'success' or 'failure', not 'skipped')
          if [ "${{ steps.tweet.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=${{ steps.tweet.outcome }})"
