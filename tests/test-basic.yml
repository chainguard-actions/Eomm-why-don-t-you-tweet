name: Test basic tweet message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action files exist
        run: |
          echo "Checking action files..."
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"
          if [ ! -f "$GITHUB_WORKSPACE/dist/index.js" ]; then
            echo "FAIL: dist/index.js not found"
            exit 1
          fi
          echo "PASS: dist/index.js found"

      - name: Verify tweet-message input is accepted
        id: action
        uses: .
        with:
          tweet-message: "Hello from GitHub Actions test!"
        continue-on-error: true

      - name: Assert action was invoked (credentials missing is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail due to missing Twitter API credentials
          # in the test environment. We just verify it was invoked and ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
